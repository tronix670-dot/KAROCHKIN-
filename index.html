<style>
:root{--bg:#faf6ea;--pn:#fff;--p2:#f3ecd4;--tx:#15110a;--mu:#7b7260;--ac:#c9971c;--gn:#9a6b00;--bd:#e7dcb8;--g1:#d9b44a;--g2:#8a6513;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050506;--pn:#111113;--p2:#1c1c20;--tx:#f6f0df;--mu:#9b9684;--ac:#e0b93f;--gn:#ecd27a;--bd:#2b281c;--g1:#f8e08a;--g2:#c9971c}}

.bal{font-weight:700;font-size:20px}

.pn{background:var(--pn);border-radius:16px;padding:14px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}
.card{aspect-ratio:1.586;border-radius:18px;padding:16px;position:relative;color:var(--c);background:var(--g);box-shadow:0 8px 24px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}

.card{container-type:inline-size}

@keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 0 var(--glow)}50%{box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 26px 6px var(--glow)}}

.card.hi{animation:pulse 2.2s infinite}

.rg{width:100%;accent-color:var(--ac);margin:8px 0}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mg button{text-align:center;font-size:12px;padding:12px 4px}.mg b{display:block;font-size:24px;font-weight:400}
.wh{position:relative;width:260px;height:260px;margin:14px auto}.wd{position:absolute;inset:0;border-radius:50%;border:4px solid var(--bd)}.wd span{position:absolute;left:50%;top:50%;width:70px;margin:-9px 0 0 -35px;text-align:center;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}.wp{position:absolute;left:50%;top:-10px;margin-left:-11px;border:11px solid transparent;border-top:20px solid var(--ac);z-index:2}
.card.br::before{content:"";position:absolute;inset:6px;border:1px solid var(--en);border-radius:13px;opacity:.55;pointer-events:none;background:radial-gradient(circle at 100% 100%,transparent 30%,var(--en) 31%,transparent 32%,transparent 42%,var(--en) 43%,transparent 44%,transparent 54%,var(--en) 55%,transparent 56%),radial-gradient(circle at 0 0,transparent 20%,var(--en) 21%,transparent 22%,transparent 30%,var(--en) 31%,transparent 32%)}
.burst{position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;border:3px solid var(--glow);animation:burst .9s .45s ease-out both;pointer-events:none}

body{background:radial-gradient(120% 55% at 50% -8%,rgba(212,175,55,.18),transparent 62%),var(--bg);background-attachment:fixed;min-height:100vh}
h1{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.3px}
.pn,.lv{border:1px solid var(--bd)}
.av{background:linear-gradient(135deg,#f8e08a,#a67c12);box-shadow:0 0 0 2px var(--bd)}
.bal{color:var(--ac);text-shadow:0 0 18px rgba(212,175,55,.25)}
.big,.ac,.x5.on{background:linear-gradient(135deg,#f8e08a,#d4af37 55%,#a67c12);color:#1a1300;border:0}
.big{font-weight:800}
.bar i{background:linear-gradient(90deg,var(--g2),var(--g1))}
#toast{background:linear-gradient(135deg,#f8e08a,#d4af37);color:#1a1300;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.stage{background:radial-gradient(circle at 50% 45%,rgba(212,175,55,.14),transparent 68%)}
.card{box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 1px rgba(212,175,55,.18)}
.tabs{border-top:1px solid var(--ac)}
.wd{border-color:var(--ac)}
.d.cur{outline-color:var(--ac)}
</style>

function comboInfo(n){let m=1;const t=[];
  for(const x of n.matchAll(/(\d)\1{3,}/g)){const b={4:2,5:4,6:8,7:15,8:30}[x[0].length]||60;m*=b;t.push(x[0]+' ×'+b)}

const PK=[{n:'Малый набор',c:5,p:7500,g:1,t:0,d:'5 карт · первая Gold и выше'},{n:'Большой набор',c:15,p:20000,g:2,t:0,d:'15 карт · первая Platinum и выше'},{n:'Премиум набор',c:10,p:65000,g:3,t:1,d:'10 карт класса «Плюс» · первая Signature и выше'},{n:'Элитный набор',c:10,p:230000,g:3,t:2,d:'10 карт класса «Премиум» · первая Signature и выше'},{n:'Императорский набор',c:7,p:800000,g:4,t:3,d:'7 карт класса «Элит» · первая Black и выше'}];

const ACH=[{t:'Первая карта',f:()=>S.pulls>=1,r:2000},{t:'Выпустить 100 карт',f:()=>S.pulls>=100,r:20000},{t:'Номер класса «Редкий» и выше',f:()=>S.st.bestNt>=2,r:10000},{t:'Легендарная карта',f:()=>S.st.bestR>=4,r:30000},{t:'Миллионер',f:()=>S.bal>=1e6,r:50000},{t:'Навыки: 10 уровней суммарно',f:()=>Object.values(S.sk).reduce((a,b)=>a+b,0)>=10,r:15000},{t:'5 заказов скупщика',f:()=>S.st.orders>=5,r:12000},{t:'10 прокруток барабана',f:()=>S.st.spins>=10,r:10000}];
const achV=()=>`<h1>Достижения</h1><div class="pn">`+ACH.map((a,i)=>{const ok=a.f(),d=S.ach.includes(i);return`<div class="li"><span>${a.t}<br><b class="gn">${fm(a.r)}</b></span><button ${d||!ok?'disabled':''} class="${ok&&!d?'ac':''}" data-a="ac" data-i="${i}">${d?'✓':ok?'Забрать':'🔒'}</button></div>`}).join('')+`</div>`;
const ratingV=()=>{const me=S.bal+S.inv.reduce((a,k)=>a+k.v,0),L=[['Georgiy',2400000],['Dafi',1100000],['Max',820000],['Vlad',450000],['Anna',220000],['Roman',90000],['Kira',40000],['Вы',me]].sort((a,b)=>b[1]-a[1]);return`<h1>Рейтинг</h1><div class="pn mu">Состояние = баланс + стоимость коллекции.</div><div class="pn">${L.map((r,i)=>`<div class="li" style="${r[0]==='Вы'?'color:var(--ac);font-weight:700':''}"><span>${i+1}. ${r[0]}</span><b>${fm(r[1])}</b></div>`).join('')}</div>`};
const profileV=()=>{const m=S.inv.find(k=>k.id===S.main),best=[...S.inv].sort((a,b)=>b.v-a.v)[0];return`<h1>Профиль</h1>${m?`<div class="stage">${card(m)}</div>`:'<div class="pn mu">Основная карта не выбрана — выбери её на экране выпуска.</div>'}<div class="pn">${[['Уровень',S.lv],['Выпущено карт',S.pulls],['В коллекции',S.inv.length],['Продано',S.st.sold],['Заказов скупщика',S.st.orders],['Лучшая карта',best?fm(best.v):'—'],['Баланс',fm(S.bal)]].map(r=>`<div class="li"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`};
const PC={CARD01:5000,START:10000,GOLD:25000,BRUTAL:50000};
const promoV=()=>`<h1>Промокод</h1><div class="pn mu">Каждый код работает один раз. Попробуй: CARD01, START, GOLD, BRUTAL.</div><input id="pr" placeholder="Например, CARD01" style="width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);font:inherit;margin-bottom:10px;text-transform:uppercase"><div class="row"><button class="big ac" data-a="promo"><span>Активировать</span></button></div>`;
const settingsV=()=>`<h1>Настройки</h1><div class="pn"><b>Тема</b><div class="row" style="margin:10px 0 0">${[['','Авто'],['light','Белая'],['dark','Чёрная'],['navy','Синяя']].map(t=>`<button class="sel ${S.th===t[0]?'x5 on':''}" data-a="theme" data-i="${t[0]||'auto'}">${t[1]}</button>`).join('')}</div></div><div class="pn"><b>Звук</b><div class="row" style="margin:10px 0 0">${[[1,'🔊 Включён'],[0,'🔇 Выключен']].map(t=>`<button class="sel ${(S.snd===0?0:1)===t[0]?'x5 on':''}" data-a="snd" data-i="${t[0]}">${t[1]}</button>`).join('')}</div></div><div class="row"><button class="sel" data-a="reset">Сбросить прогресс</button></div>`;
const MN=[['play','💳','Выпуск'],['upg','⭕','Апгрейдер'],['quests','📜','Квесты'],['skills','⚡','Навыки'],['trade','🔁','Торговля'],['shop','🛍️','Магазин'],['pass','👑','Пропуск'],['buyer','🏷️','Скупщик'],['rew','🎁','Награды'],['ach','🏆','Достижения'],['profile','👤','Профиль'],['hist','🧾','История'],['promo','🔑','Промокод'],['rules','❓','Шансы'],['settings','⚙️','Настройки']];
function render(){dayReset();
  const T=[['play','💳','Выпуск'],['coll','🗂️','Коллекция'],['upg','⭕','Апгрейд'],['wheel','🎡','Барабан'],['menu','☰','Меню']];
  const v={play,buyer,coll,rew:rewards,hist,rules,wheel:wheelV,quests:questsV,skills:skillsV,trade:tradeV,pass:passV,shop:shopV,ach:achV,rating:ratingV,profile:profileV,promo:promoV,settings:settingsV,upg:upgV}[tab]||play;
  let ov='';
  if(sheet==='menu'){ov=`<div class="ov" data-a="close"><div class="sh"><h1 style="font-size:22px">Меню</h1><div class="mg">${MN.map(m=>`<button data-a="go" data-i="${m[0]}"><b>${m[1]}</b>${m[2]}</button>`).join('')}</div></div></div>`}else if(sheet==='info'){const k=S.inv.find(z=>z.id===cur);if(k){const r=R[k.r],t=NT[k.nt],c=cn(k.c);ov=`<div class="ov" data-a="close"><div class="sh"><h1 style="font-size:22px">Детали карты</h1><div class="li"><span>Класс</span><b style="color:${r.col}">${r.n} · ${r.t}</b></div><div class="li"><span>Номер</span><b>${k.n.match(/.{4}/g).join(' ')}</b></div><div class="li"><span>BIN (6 цифр)</span><b>${k.n.slice(0,6)} → ${k.bank}</b></div><div class="li"><span>Платёжная система</span><b>${PSL[+k.n[0]%5].n}</b></div><div class="li"><span>Контрольная цифра</span><b style="color:${k.lu===0?'#e0475b':'var(--gn)'}">${k.n[15]} · Луна ${k.lu===0?'не проходит ✗':'проходит ✓'}</b></div>${k.lu===0?`<button class="big ac" data-a="fix" style="margin:8px 0;width:100%"><span>🛠 Исправить цифру</span><span>500 ₽</span></button>`:''}<div class="li"><span>Комбинации</span><b style="text-align:right">${(c=>c.m>1?'×'+c.m+' · '+c.t.join(', '):'нет')(comboInfo(k.n))}</b></div><div class="li"><span>Редкость номера</span><b style="color:${R[k.nt].col}">${t.n} · ×${t.m}</b></div><div class="li"><span>Банк</span><b>${k.bank}</b></div><div class="li"><span>Страна</span><b>${c.f} ${c.n}</b></div><div class="li"><span>Дизайн</span><b>${SK[k.s??k.id%8].n} · ×${SK[k.s??k.id%8].m}</b></div><div class="li"><span>Срок</span><b>${k.e}</b></div>${k.luck?'<div class="li"><span>Удача</span><b>×5</b></div>':''}<div class="li"><span>Оценка</span><b class="gn">${fm(k.v)}</b></div></div></div>`}}else if(sheet){const cs=sheet==='country'?C:[{id:'any',n:'Любой банк',f:'🎲'}].concat((cn(S.co).b).map(b=>({id:b,n:b,f:'🏦'})));
    ov=`<div class="ov" data-a="close"><div class="sh"><h1 style="font-size:22px">${sheet==='country'?'Страна выпуска':'Банк'}</h1>${sheet==='bank'&&S.co==='any'?'<div class="mu">Сначала выбери страну — банки зависят от неё.</div>':cs.map(o=>`<button class="opt ${(sheet==='country'?S.co:S.bk)===o.id?'on':''}" data-a="pick" data-i="${o.id}">${o.f} ${o.n}${sheet==='country'?` <span class="mu">${o.m>0?'+':''}${Math.round(o.m*100)||'базовая'}${o.m?'%':''}</span>`:''}</button>`).join('')}</div></div>`}
  $('#app').innerHTML=hdr()+v()+ov+`<div class="tabs"><div>${T.map(t=>`<button class="${tab===t[0]?'on':''}" data-a="go" data-i="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('')}</div></div>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i;if(busy&&a!=='go'&&a!=='skip')return;SND.click();
  if(a==='go'){if(i==='menu')sheet='menu';else{tab=i;sheet=null;scrollTo(0,0)}render()}
  else if(a==='issue')issue();
  else if(a==='x5'){x5=!x5;render()}
  else if(a==='cur'){cur=+i;render()}
  else if(a==='main'){S.main=S.main===+i?null:+i;save();render()}
  else if(a==='sell')sell(+i);
  else if(a==='sh'){sheet=i;render()}
  else if(a==='close'){if(e.target===el){sheet=null;render()}}
  else if(a==='pick'){if(sheet==='country'){S.co=i;S.bk='any'}else S.bk=i;sheet=null;save();render()}
  else if(a==='ful')fulfil(+i);
  else if(a==='claim')claim();
  else if(a==='spinw')spinWheel();
  else if(a==='fix'){const k=S.inv.find(z=>z.id===cur);if(k&&k.lu===0&&S.bal>=500){S.bal-=500;const o=fac(k);k.n=k.n.slice(0,15)+ckd(k.n.slice(0,15));k.lu=1;k.nt=nTier(k.n);k.v=Math.max(minV(k.pt),Math.round(k.v*fac(k)/o/10)*10);log('Ремонт карты',-500);toast('Контрольная цифра исправлена');save();render()}else toast('Не хватает денег')}
  else if(a==='pt'){S.pt=+i;save();render()}
  else if(a==='skip')skipA=true;
  else if(a==='snd'){S.snd=+i;save();render()}
  else if(a==='ups'){const id=+i;if(upS.includes(id))upS=upS.filter(x=>x!==id);else if(upS.length<5)upS.push(id);regenT();upRes=null;render()}
  else if(a==='upp'){upP=+i;regenT();render()}
  else if(a==='upt'){upI=+i;render()}
  else if(a==='upr'){regenT();render()}
  else if(a==='upg')upGo();
  else if(a==='skup'){const k=SKL[i],l=S.sk[k.k];if(l<10&&S.bal>=sc(l)){S.bal-=sc(l);S.sk[k.k]++;log('Навык «'+k.n+'»',-sc(l));save();render()}else toast('Не хватает денег')}
  else if(a==='qc'){const q=QD[i];if(S.q.c[q.k]>=q.n&&!S.q.got.includes(+i)){S.q.got.push(+i);S.bal+=q.r;S.xp+=40;log('Квест',q.r);toast('+'+fm(q.r));save();render()}}
  else if(a==='ac'){const x=ACH[i];if(x.f()&&!S.ach.includes(+i)){S.ach.push(+i);S.bal+=x.r;log('Достижение',x.r);toast('+'+fm(x.r));save();render()}}
  else if(a==='bpc'){const n=+i;if(Math.floor(S.pulls/10)>=n&&!S.bp.includes(n)){S.bp.push(n);S.bal+=n*2500;log('Пропуск, ур. '+n,n*2500);save();render()}}
  else if(a==='buyp'){const k=PK[i];deal(k.c,k.p,k.n,k.g,k.t)}
  else if(a==='mkb'){const k=S.mk[+i];if(k&&S.bal>=k.p){const p=k.p;S.bal-=p;S.mk.splice(+i,1);delete k.p;S.inv.push(k);log('Покупка на рынке',-p);toast('Куплено: '+R[k.r].t);save();render()}else toast('Не хватает денег')}
  else if(a==='mkr'){if(S.bal>=1000){S.bal-=1000;S.mk=[];save();render()}else toast('Не хватает денег')}
  else if(a==='promo'){const c=($('#pr').value||'').trim().toUpperCase();if(S.promo.includes(c))toast('Код уже использован');else if(PC[c]){S.promo.push(c);S.bal+=PC[c];log('Промокод '+c,PC[c]);toast('+'+fm(PC[c]));save();render()}else toast('Неверный код')}
  else if(a==='theme'){S.th=i==='auto'?'':i;if(S.th)document.documentElement.dataset.theme=S.th;else delete document.documentElement.dataset.theme;save();render()}
  else if(a==='reset'){if(confirm('Сбросить весь прогресс?')){S=def();batch=[];cur=null;save();tab='play';render()}}
});
document.addEventListener('input',e=>{if(e.target.id==='ur'){const v=+e.target.value;$('#pv').textContent=v+'%';$('#pct').textContent=v+'%';$('#arc').setAttribute('stroke-dasharray',(565.5*v/100)+' 565.5')}});
document.addEventListener('change',e=>{if(e.target.id==='ur'&&!busy){upP=+e.target.value;regenT();render()}});
migrate();render();
</script>
</body>
</html>
