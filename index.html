<!DOCTYPE html>
<html lang="ru">
<head>

<title>Карточки — коллекция банковских карт</title>
<style>
:root{--bg:#050b1c;--pn:#0c1733;--p2:#14265a;--tx:#eef4ff;--mu:#8296c4;--ac:#3b82f6;--gn:#35d07f;--bd:#1c2f63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.lv{flex:1;background:var(--pn);border-radius:20px;padding:6px 12px;font-size:13px}

.bal{font-weight:700;font-size:20px}
h1{font-size:28px;margin:6px 0 12px}
.pn{background:var(--pn);border-radius:16px;padding:14px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}
.card{aspect-ratio:1.586;border-radius:18px;padding:16px;position:relative;color:var(--c);background:var(--g);box-shadow:0 8px 24px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.card .bk{font-weight:700;font-size:16px}.card .ch{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f0d27a,#b88a1c);opacity:.9}
.card .nm{font-size:22px;letter-spacing:2px;font-weight:600}.card .ft{display:flex;justify-content:space-between;font-size:12px;opacity:.85}
.card .ps{position:absolute;right:16px;bottom:34px;display:flex}.ps i{width:26px;height:26px;border-radius:50%;background:#ff5a5f;opacity:.9}.ps i+i{background:#ffb400;margin-left:-10px}
.card .tg{position:absolute;right:14px;top:14px;font-size:11px;font-weight:700;background:rgba(0,0,0,.25);color:#fff;padding:2px 8px;border-radius:10px}

.ac{background:var(--ac);color:#fff;border:0;font-weight:700}

.x5.on{background:var(--ac);color:#fff;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}

.gn{color:var(--gn);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{padding:10px}.grid .tg{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:75%;overflow:auto}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px}.opt.on{border-color:var(--ac)}

table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:20;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}#toast.on{opacity:1}
.card{container-type:inline-size}
.card .bk{display:flex;align-items:center;gap:6px;font-size:clamp(11px,4.4cqw,18px)}
.lg{width:1.7em;height:1.7em;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:.9em;flex:none}
.card .ch{width:13cqw;height:10cqw}
.card .nm{display:flex;justify-content:space-between;font:600 clamp(12px,5.6cqw,26px)/1 ui-monospace,Menlo,Consolas,monospace}
.nm u{text-decoration-thickness:2px;text-underline-offset:5px}
.card .ft{font-size:clamp(9px,3.3cqw,13px);opacity:1}.ft .nt{font-weight:700}
.stage{position:relative;overflow:hidden;padding:12px 4px;perspective:900px}
@keyframes drop{0%{transform:translateY(-140%) rotateY(180deg) rotateZ(-12deg) scale(.6);opacity:0}55%{opacity:1;transform:translateY(6%) rotateY(0) rotateZ(3deg) scale(1.04)}75%{transform:translateY(-2%) rotateZ(-1deg) scale(.99)}100%{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 0 var(--glow)}50%{box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 26px 6px var(--glow)}}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes burst{from{opacity:.9;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(30)}}
.card.drop{animation:drop .7s cubic-bezier(.2,.8,.3,1) both}
.card.hi{animation:pulse 2.2s infinite}
.card.hi.drop{animation:drop .7s cubic-bezier(.2,.8,.3,1) both,pulse 2.2s .7s infinite}
.card.hi::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-100%);animation:shine 2.8s infinite;pointer-events:none}
.card .nm{font-size:clamp(9px,6.1cqw,28px);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.nm i{font-style:normal}.nm i.r{opacity:.4}.nm i.lk{animation:lockp .4s}
@keyframes lockp{0%{transform:scale(1.6);color:#8ec5ff}100%{transform:none}}
.tiers{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}.tiers button{flex:none;text-align:center;padding:8px 12px;font-size:13px}.tiers small{display:block;font-size:11px;opacity:.75}
.sel2{outline:3px solid var(--ac);outline-offset:2px;border-radius:18px}
.card .nm{gap:1cqw}.nm>span{display:flex;gap:.8cqw}
.nm i{display:grid;place-items:center;width:4.7cqw;height:6.8cqw;font-size:4.6cqw;line-height:1;border-radius:1cqw;font-weight:700;text-shadow:none;border:1px solid var(--en);background:rgba(0,0,0,.18);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.nm span.pt i{border-width:2px;background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:0 0 6px var(--en)}
.nm i.bn{box-shadow:inset 0 -2px 0 var(--en)}.nm i.ok{border-color:#12c26b}.nm i.bad{border-color:#e0475b;background:rgba(224,71,91,.35)}
.rg{width:100%;accent-color:var(--ac);margin:8px 0}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mg button{text-align:center;font-size:12px;padding:12px 4px}.mg b{display:block;font-size:24px;font-weight:400}
.wh{position:relative;width:260px;height:260px;margin:14px auto}.wd{position:absolute;inset:0;border-radius:50%;border:4px solid var(--bd)}.wd span{position:absolute;left:50%;top:50%;width:70px;margin:-9px 0 0 -35px;text-align:center;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}.wp{position:absolute;left:50%;top:-10px;margin-left:-11px;border:11px solid transparent;border-top:20px solid var(--ac);z-index:2}
.card.br::before{content:"";position:absolute;inset:6px;border:1px solid var(--en);border-radius:13px;opacity:.55;pointer-events:none;background:radial-gradient(circle at 100% 100%,transparent 30%,var(--en) 31%,transparent 32%,transparent 42%,var(--en) 43%,transparent 44%,transparent 54%,var(--en) 55%,transparent 56%),radial-gradient(circle at 0 0,transparent 20%,var(--en) 21%,transparent 22%,transparent 30%,var(--en) 31%,transparent 32%)}
.burst{position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;border:3px solid var(--glow);animation:burst .9s .45s ease-out both;pointer-events:none}
</style>

<script>
const R=[
{n:'Обычный',t:'Classic',w:60,lo:200,hi:400,g:'linear-gradient(135deg,#f4f4f6,#d3d6dc)',c:'#1b1b1f',col:'#9a9aa5'},
{n:'Необычный',t:'Gold',w:24,lo:500,hi:900,g:'linear-gradient(135deg,#f6e08f,#c9a23a)',c:'#2b2100',col:'#35d07f'},
{n:'Редкий',t:'Platinum',w:11,lo:1200,hi:2000,g:'linear-gradient(135deg,#e3ecf8,#8fa6c9)',c:'#0e1a30',col:'#4c8dff'},
{n:'Эпический',t:'Signature',w:3.8,lo:3000,hi:5000,g:'linear-gradient(135deg,#9a6cff,#4a1fb8)',c:'#fff',col:'#a56bff'},
{n:'Легендарный',t:'Black',w:1,lo:10000,hi:15000,g:'linear-gradient(135deg,#2e2e34,#08080a)',c:'#ffc83d',col:'#ff9f1a'},
{n:'Мифический',t:'Obsidian ∞',w:.2,lo:40000,hi:60000,g:'linear-gradient(135deg,#ff3d6e,#5b0fff,#00d4ff)',c:'#fff',col:'#ff4d7a'}];
const C=[

{id:'RU',f:'🇷🇺',n:'Россия',m:.15,b:['Волга Банк','Северный Капитал','Аврора','Балтика','Сибирь Инвест']},
{id:'US',f:'🇺🇸',n:'США',m:.10,b:['Liberty Trust','Ironwood','Bluepeak','Empire Savings','Pacific Gold']},
{id:'DE',f:'🇩🇪',n:'Германия',m:-.05,b:['Rheinwerk Bank','Alpenfinanz','Bavaria Kredit']},
{id:'JP',f:'🇯🇵',n:'Япония',m:0,b:['Sakura Union','Hoshi Bank','Fuji Meridian']},
{id:'BR',f:'🇧🇷',n:'Бразилия',m:-.15,b:['Banco Verde','Aurora BR','Banco Sol']},

{id:'GB',f:'🇬🇧',n:'Великобритания',m:.10,b:['Thames & Crown','Albion Trust','Kingsgate']},
{id:'AE',f:'🇦🇪',n:'ОАЭ',m:.05,b:['Dune Capital','Oasis Bank']},
{id:'CH',f:'🇨🇭',n:'Швейцария',m:.15,b:['Helvetia Privé','Matterhorn Bank','Edelweiss']},
{id:'SG',f:'🇸🇬',n:'Сингапур',m:.10,b:['Merlion Bank','Lion City Trust']},
{id:'TR',f:'🇹🇷',n:'Турция',m:-.10,b:['Bosphorus Bank','Anatolia Finans']},
{id:'KZ',f:'🇰🇿',n:'Казахстан',m:-.05,b:['Altyn Bank','Steppe Capital']},
{id:'KR',f:'🇰🇷',n:'Южная Корея',m:0,b:['Hanbit Bank','Seoul Meridian']},
{id:'IN',f:'🇮🇳',n:'Индия',m:-.10,b:['Bharat Union','Taj Meridian']},
{id:'IT',f:'🇮🇹',n:'Италия',m:-.05,b:['Banca Aurelia','Medici Credito']}];
const NT=[{n:'Обычный',m:.25,w:77,ex:'1826 8299 5274 1063'},{n:'Необычный',m:.6,w:17,ex:'5821 4444 9073 2615'},{n:'Редкий',m:1.5,w:4.5,ex:'1234 7777 5382 4004'},{n:'Эпический',m:4,w:1.2,ex:'4444 7000 9999 5271'},{n:'Легендарный',m:9,w:.28,ex:'2222 8000 1111 3333'},{n:'Мифический',m:12,w:.02,ex:'7777 7777 7777 7777'}];
const BASE=1000,LUCK=20,DAILY=[10000,15000,25000,35000,50000,75000,150000];
const $=s=>document.querySelector(s),rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),fm=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const cn=id=>C.find(c=>c.id===id);
let S,tab='play',sheet=null,x5=false,cur=null,batch=[],busy=false,dropId=null;
const def=()=>({bal:50000,xp:0,lv:1,pulls:0,inv:[],hist:[],streak:0,last:'',main:null,co:'any',bk:'any',orders:[newOrder(),newOrder(),newOrder()],uid:1,sk:{luck:0,trade:0,disc:0,xp:0},q:{d:'',c:{pull:0,sell:0,rare:0,order:0,spin:0},got:[]},ach:[],st:{sold:0,orders:0,bestR:0,bestNt:0,spins:0},wl:'',promo:[],bp:[],mk:[],th:'',pt:0});
try{S=JSON.parse(localStorage.getItem('cardgame2')||'null')}catch(e){}
S=Object.assign(def(),S||{});
if(!S.nv){const O=[1,1.3,2,4,10,40],r10=x=>Math.round(x/10)*10;S.inv.concat(S.mk).forEach(k=>{if(k.nt!=null){const f=NT[k.nt].m/O[k.nt];k.v=r10(k.v*f);if(k.p)k.p=r10(k.p*f)}});S.nv=1}if(S.th)document.documentElement.dataset.theme=S.th;
const save=()=>{try{localStorage.setItem('cardgame2',JSON.stringify(S))}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),1800)}
function log(t,a){S.hist.unshift({t,a,d:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});S.hist=S.hist.slice(0,60)}
function price(){const c=cn(S.co);return Math.round(TR[S.pt].p*(1+c.m)*(S.bk!=='any'?1.1:1)*(1-.02*S.sk.disc))}
function roll(){const W=R.map((r,i)=>r.w*(i>=2?1+.06*S.sk.luck:1));let t=Math.random()*W.reduce((a,b)=>a+b,0),i=0;for(;i<5;i++){if((t-=W[i])<0)break}return i}
const rg=()=>String(rnd(0,9999)).padStart(4,'0'),sol=()=>{const a=rnd(1,9);return Math.random()<.35?a+'000':String(a).repeat(4)},lad=()=>{const a=rnd(0,6);return Math.random()<.6?[a,a+1,a+2,a+3].join(''):[a+3,a+2,a+1,a].join('')},mir=()=>{const a=rnd(0,9),b=rnd(0,9),k=rnd(0,2);return k===0?`${a}${b}${b}${a}`:k===1?`${a}${b}${a}${b}`:`${a}${a}${b}${b}`};
function gscore(g){const d=[...g].map(Number);
  if(d.every(x=>x===d[0])||(d[0]&&!d[1]&&!d[2]&&!d[3]))return 4;
  if(d.every((x,i)=>!i||x===d[i-1]+1)||d.every((x,i)=>!i||x===d[i-1]-1))return 3;
  if((d[0]===d[3]&&d[1]===d[2])||(d[0]===d[2]&&d[1]===d[3])||(d[0]===d[1]&&d[2]===d[3]))return 2;return 0}
function nTier(n){const sc=n.match(/.{4}/g).map(gscore),so=sc.filter(x=>x===4).length,p=sc.reduce((a,b)=>a+b,0);
  if(/^(\d)\1{15}$/.test(n))return 5;const pal=n===[...n].reverse().join('');if(so===4)return 4;if(so===3||p>=12||pal)return 3;if(p>=7)return 2;return p>=3?1:0}
function comboInfo(n){let m=1;const t=[];
  for(const x of n.matchAll(/(\d)\1{3,}/g)){const b={4:2,5:4,6:8,7:15,8:30}[x[0].length]||60;m*=b;t.push(x[0]+' ×'+b)}
  let bi=0,bl=1,a=1,d=1;for(let i=1;i<16;i++){a=+n[i]===+n[i-1]+1?a+1:1;d=+n[i]===+n[i-1]-1?d+1:1;const l=Math.max(a,d);if(l>bl){bl=l;bi=i-l+1}}
  if(bl>=5){const b={5:3,6:8,7:20}[bl]||50;m*=b;t.push('лесенка '+n.substr(bi,bl)+' ×'+b)}
  if(n.slice(0,4)===n.slice(4,8)&&n.slice(4,8)===n.slice(8,12)&&n.slice(8,12)===n.slice(12)){m*=40;t.push('4 одинаковых блока ×40')}
  else if(n.slice(0,8)===n.slice(8)){m*=15;t.push('две одинаковые половины ×15')}
  return{m:Math.min(m,150),t}}
const combo=n=>comboInfo(n).m;
const luhn=n=>{let t=0;for(let i=0;i<n.length;i++){let d=+n[n.length-1-i];if(i%2){d*=2;if(d>9)d-=9}t+=d}return t%10===0};
const ckd=b=>{for(let d=0;d<10;d++)if(luhn(b+d))return d};
const BKS=C.slice(1).flatMap(c=>c.b.map(b=>({b,c:c.id}))).map(x=>({...x,m:.9+([...x.b].reduce((a,ch)=>a+ch.charCodeAt(0),0)%7)*.1}));
const PSL=[{n:'Vega',m:1.8},{n:'Zeta',m:1},{n:'Kappa',m:1.4},{n:'Nova',m:.95},{n:'Orbit',m:.85}];
const binIdx=n=>parseInt(n.slice(0,6),10)%BKS.length,binF=n=>PSL[+n[0]%5].m*BKS[binIdx(n)].m/1.4,fac=k=>NT[k.nt].m*combo(k.n)*(k.lu===0?.4:1);
function genNum(f){let t=0,x=Math.random()*100;for(;t<5;t++){if((x-=NT[t].w)<0)break}
  const ok=n=>luhn(n)&&(!f||f(BKS[binIdx(n)]));
  for(;t>=0;t--){for(let i=0;i<(t?1500:3000);i++){const g=[rg(),rg(),rg(),rg()];let n;
    if(t===1)g[rnd(0,3)]=[sol,lad,mir][rnd(0,2)]();
    if(t===2){const a=[0,1,2,3].sort(()=>Math.random()-.5);g[a[0]]=sol();g[a[1]]=Math.random()<.5?lad():sol()}
    if(t===3){for(let j=0;j<3;j++)g[j]=sol();g.sort(()=>Math.random()-.5)}
    if(t===4)for(let j=0;j<4;j++)g[j]=sol();
    n=t===5?'8'.repeat(16):g.join('');
    if(t===3&&Math.random()<.4){const h=rg()+rg();n=h+[...h].reverse().join('')}
    if(nTier(n)===t&&ok(n))return n}}
  for(let i=0;i<800;i++){const b=String(rnd(0,999999)).padStart(6,'0')+String(rnd(0,999999999)).padStart(9,'0');if(!f||f(BKS[binIdx(b)]))return b+ckd(b)}
  return'4276000000000000'}
const VG=.15,minV=t=>Math.round(TR[t||0].p*.8);
function make(min=0,free=0,t=0){
  const f=!free&&(S.co!=='any'||S.bk!=='any')?b=>(S.co==='any'||b.c===S.co)&&(S.bk==='any'||b.b===S.bk):null;
  let n=genNum(f),lu=1;if(Math.random()<.08){n=n.slice(0,15)+((+n[15]+rnd(1,9))%10);lu=0}
  const bi=BKS[binIdx(n)],c=cn(bi.c),bank=bi.b,nt=nTier(n);

  const v={play,buyer,coll,rew:rewards,hist,rules,wheel:wheelV,quests:questsV,skills:skillsV,trade:tradeV,pass:passV,shop:shopV,ach:achV,rating:ratingV,profile:profileV,promo:promoV,settings:settingsV,upg:upgV}[tab]||play;

  if(sheet==='menu'){ov=`<div class="ov" data-a="close"><div class="sh"><h1 style="font-size:22px">Меню</h1><div class="mg">${MN.map(m=>`<button data-a="go" data-i="${m[0]}"><b>${m[1]}</b>${m[2]}</button>`).join('')}</div></div></div>`}else if(sheet==='info'){const k=S.inv.find(z=>z.id===cur);if(k){const r=R[k.r],t=NT[k.nt],c=cn(k.c);ov=`<div class="ov" data-a="close"><div class="sh"><h1 style="font-size:22px">Детали карты</h1><div class="li"><span>Класс</span><b style="color:${r.col}">${r.n} · ${r.t}</b></div><div class="li"><span>Номер</span><b>${k.n.match(/.{4}/g).join(' ')}</b></div><div class="li"><span>BIN (6 цифр)</span><b>${k.n.slice(0,6)} → ${k.bank}</b></div><div class="li"><span>Платёжная система</span><b>${PSL[+k.n[0]%5].n}</b></div><div class="li"><span>Контрольная цифра</span><b style="color:${k.lu===0?'#e0475b':'#12a85c'}">${k.n[15]} · Луна ${k.lu===0?'не проходит ✗':'проходит ✓'}</b></div>${k.lu===0?`<button class="big ac" data-a="fix" style="margin:8px 0;width:100%"><span>🛠 Исправить цифру</span><span>500 ₽</span></button>`:''}<div class="li"><span>Комбинации</span><b style="text-align:right">${(c=>c.m>1?'×'+c.m+' · '+c.t.join(', '):'нет')(comboInfo(k.n))}</b></div><div class="li"><span>Редкость номера</span><b style="color:${R[k.nt].col}">${t.n} · ×${t.m}</b></div><div class="li"><span>Банк</span><b>${k.bank}</b></div><div class="li"><span>Страна</span><b>${c.f} ${c.n}</b></div><div class="li"><span>Дизайн</span><b>${SK[k.s??k.id%8].n} · ×${SK[k.s??k.id%8].m}</b></div><div class="li"><span>Срок</span><b>${k.e}</b></div>${k.luck?'<div class="li"><span>Удача</span><b>×5</b></div>':''}<div class="li"><span>Оценка</span><b class="gn">${fm(k.v)}</b></div></div></div>`}}else if(sheet){const cs=sheet==='country'?C:[{id:'any',n:'Любой банк',f:'🎲'}].concat((cn(S.co).b).map(b=>({id:b,n:b,f:'🏦'})));
    ov=`<div class="ov" data-a="close"><div class="sh"><h1 style="font-size:22px">${sheet==='country'?'Страна выпуска':'Банк'}</h1>${sheet==='bank'&&S.co==='any'?'<div class="mu">Сначала выбери страну — банки зависят от неё.</div>':cs.map(o=>`<button class="opt ${(sheet==='country'?S.co:S.bk)===o.id?'on':''}" data-a="pick" data-i="${o.id}">${o.f} ${o.n}${sheet==='country'?` <span class="mu">${o.m>0?'+':''}${Math.round(o.m*100)||'базовая'}${o.m?'%':''}</span>`:''}</button>`).join('')}</div></div>`}
  $('#app').innerHTML=hdr()+v()+ov+`<div class="tabs"><div>${T.map(t=>`<button class="${tab===t[0]?'on':''}" data-a="go" data-i="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('')}</div></div>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i;if(busy&&a!=='go'&&a!=='skip')return;SND.click();
  if(a==='go'){if(i==='menu')sheet='menu';else{tab=i;sheet=null;scrollTo(0,0)}render()}
  else if(a==='issue')issue();
  else if(a==='x5'){x5=!x5;render()}
  else if(a==='cur'){cur=+i;render()}
  else if(a==='main'){S.main=S.main===+i?null:+i;save();render()}
  else if(a==='sell')sell(+i);
  else if(a==='sh'){sheet=i;render()}
  else if(a==='close'){if(e.target===el){sheet=null;render()}}
  else if(a==='pick'){if(sheet==='country'){S.co=i;S.bk='any'}else S.bk=i;sheet=null;save();render()}
  else if(a==='ful')fulfil(+i);
  else if(a==='claim')claim();
  else if(a==='spinw')spinWheel();
  else if(a==='fix'){const k=S.inv.find(z=>z.id===cur);if(k&&k.lu===0&&S.bal>=500){S.bal-=500;const o=fac(k);k.n=k.n.slice(0,15)+ckd(k.n.slice(0,15));k.lu=1;k.nt=nTier(k.n);k.v=Math.max(minV(k.pt),Math.round(k.v*fac(k)/o/10)*10);log('Ремонт карты',-500);toast('Контрольная цифра исправлена');save();render()}else toast('Не хватает денег')}
  else if(a==='pt'){S.pt=+i;save();render()}
  else if(a==='skip')skipA=true;
  else if(a==='snd'){S.snd=+i;save();render()}
  else if(a==='ups'){const id=+i;if(upS.includes(id))upS=upS.filter(x=>x!==id);else if(upS.length<5)upS.push(id);regenT();upRes=null;render()}
  else if(a==='upp'){upP=+i;regenT();render()}
  else if(a==='upt'){upI=+i;render()}
  else if(a==='upr'){regenT();render()}
  else if(a==='upg')upGo();
  else if(a==='skup'){const k=SKL[i],l=S.sk[k.k];if(l<10&&S.bal>=sc(l)){S.bal-=sc(l);S.sk[k.k]++;log('Навык «'+k.n+'»',-sc(l));save();render()}else toast('Не хватает денег')}
  else if(a==='qc'){const q=QD[i];if(S.q.c[q.k]>=q.n&&!S.q.got.includes(+i)){S.q.got.push(+i);S.bal+=q.r;S.xp+=40;log('Квест',q.r);toast('+'+fm(q.r));save();render()}}
  else if(a==='ac'){const x=ACH[i];if(x.f()&&!S.ach.includes(+i)){S.ach.push(+i);S.bal+=x.r;log('Достижение',x.r);toast('+'+fm(x.r));save();render()}}
  else if(a==='bpc'){const n=+i;if(Math.floor(S.pulls/10)>=n&&!S.bp.includes(n)){S.bp.push(n);S.bal+=n*2500;log('Пропуск, ур. '+n,n*2500);save();render()}}
  else if(a==='buyp'){const k=PK[i];deal(k.c,k.p,k.n,Math.random()<k.gp?k.g:0,k.t)}
  else if(a==='mkb'){const k=S.mk[+i];if(k&&S.bal>=k.p){const p=k.p;S.bal-=p;S.mk.splice(+i,1);delete k.p;S.inv.push(k);log('Покупка на рынке',-p);toast('Куплено: '+R[k.r].t);save();render()}else toast('Не хватает денег')}
  else if(a==='mkr'){if(S.bal>=1000){S.bal-=1000;S.mk=[];save();render()}else toast('Не хватает денег')}
  else if(a==='promo'){const c=($('#pr').value||'').trim().toUpperCase();if(S.promo.includes(c))toast('Код уже использован');else if(PC[c]){S.promo.push(c);S.bal+=PC[c];log('Промокод '+c,PC[c]);toast('+'+fm(PC[c]));save();render()}else toast('Неверный код')}
  else if(a==='theme'){S.th=i==='auto'?'':i;if(S.th)document.documentElement.dataset.theme=S.th;else delete document.documentElement.dataset.theme;save();render()}
  else if(a==='reset'){if(confirm('Сбросить весь прогресс?')){S=def();batch=[];cur=null;save();tab='play';render()}}
});
document.addEventListener('input',e=>{if(e.target.id==='ur'){const v=+e.target.value;$('#pv').textContent=v+'%';$('#pct').textContent=v+'%';$('#arc').setAttribute('stroke-dasharray',(565.5*v/100)+' 565.5')}});
document.addEventListener('change',e=>{if(e.target.id==='ur'&&!busy){upP=+e.target.value;regenT();render()}});
migrate();render();
</script>
</body>
</html>
